# 冒烟/自检用的求解参数。格式与 config/solver.toml 完全相同。

[training]
mode = "multi"
iterations = 10
forward_paths_per_process = 1     # 2 进程 × 1 = 2 条前向路径
n_backward_samples = 0            # 0 = 全枚举（池只有 30 条，够快）
checkpoint_interval = 600.0
max_train_seconds = 0
cut_selection = "lml1"
cut_select_eps = 1e-6
cut_select_keep_rounds = 0
seed = 2026

[multicut]
n_clusters = 2
group_mode = "failure_quantile"

[io]
payload_mode = "pickle"


[refine]
enabled = true
max_refines = 3
max_clusters_per_stage = 4
theta_cap = 4
max_attempts = 6
max_children_per_event = 4
min_child_size = 1
candidate_stage_stride = 1
min_remaining_seconds = 0
min_event_gain = 0.0
max_ineffective_events = 2
warmup_rounds = 0
stall_on = "lb_best"
stall_window = 2
stall_rtol = 1e-9
stall_abs = 0.0
cooldown_rounds = 0
recovery_frac = 1.0
recovery_timeout = 0
min_refine_stage = 1
signature = "pi"
eps_sig = 0.0
eps_sig_rel = 0.5
eps_obj = 0.0

[parallel]
n_processes = 1                   # 2 进程：冒烟也走一趟多进程链路
threads_per_process = 1

[simulation]
n_simulations = 50
chunk_size = 25

[numerics]
feas_tol = 1e-6
dual_tol = 1e-6
int_tol = 1e-6
presolve = -1
mip_rel_gap = 0.001       # 前向 MIP 相对 gap 容忍（见 config/solver.toml 说明）
mip_time_limit = 20.0     # 单次 MIP 时限（秒）

[output]
tag = "smoke"
results_root = "results"
