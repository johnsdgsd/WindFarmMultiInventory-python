# 问题参数：风场多仓库备件库存管理（docs/问题.md）
#
# 默认值只写在这一份文件里，代码里没有第二处默认值 —— 改这里必定生效。
# 训练时本文件会被原样拷贝进结果目录。
#
# 维度一旦改动，旧结果目录的割不再兼容（状态维度变了），必须全新训练。
#
# ★ 本组参数为**定标结果**（推导、文献依据与校验见 docs/系统参数定标.md）：
#   m=2.5 / η=148 月 / T=60 月 —— 由「质保期内失效占 10%」+「规划周期 < 寿命」反解，
#   η 换算约 108,000 运行小时，对上 ZF 厂家齿轮箱的 100,000 h 指标。

[dimension]
T = 60         # 规划周期数（月）= 5 年 = 质保期。T/η = 0.41 < 1 ⇒ 规划周期短于寿命
A = 80         # 月龄分档上限（月）；月龄 a = 0..A−1，A−1 为到寿
               # 硬约束 A ≥ T+1：否则 T 期内会撞到到寿档，造出「集中到寿悬崖」。
               #   期初最高月龄 spread_init−1，T 期后到 spread_init+T−2，需 < A−1。
               # A 直接决定状态维（N_R·A + N_R + (L−1)·N_R + N_R = 5A+15），是训练
               #   速度的主要杠杆：120 → 80 省 33%（615 → 415 维）。A=80 留 20 期余量。
N_R = 5        # 仓库数量
L = 3          # 订货提前期（月）；在途管 L−1 层，要求 ≥ 2
               # 齿轮箱实际订货提前期是数月（L=2 只用 1 期就补上，缺货完全自愈）。

[fleet]
# ★ 2026-10-12 第二实验组：机队 ×0.35，**Qmax 不跟着等比缩**（只缩到 ×0.44）。
#
#   机队 N 与 Qmax 是两个独立旋钮，别混为一谈：
#     N             决定标定真实性（年失效台数）、rint 精度、蜜月期长短
#     F峰值 / ΣQmax 决定**停机占总成本的比例** —— 缺口有多深
#   若 N 与 Qmax 按同一比例缩，比值不变 ⇒ 停机占比一点不改善，只是换了个单位。
#   本组：N ×0.35、Qmax ×0.44 ⇒ 比值从 1.56 压到 1.25（上一组末 12 期停机占 92.8%）。
#
#   代价（`rint(θ·n)` 的 0.5 阈值是**绝对量**，机队一小就显形）：
#     蜜月期（rint 口径零失效期数）  3 期 → 8 期（占视界 13%）
#     取整误差                       −0.2% → ≈ −1%
#
#   口径对照：全系统年失效 ≈ 0.0914 × N = 1,465 台/年（定标值 5,500 台 ⇒ 503 台/年）。
N = [3680, 2730, 3780, 3320, 2520]
# 各仓库订货批量上限。**关键判据：峰值月失效 > Qmax** —— 只有这样缺货才必然发生，
# 值函数才非零，Benders 割才带信息（见 docs/建模与实现.md「LB≡0」）。
# 反推口径：ΣQmax = F_peak / 1.25 = (0.004099 × ΣN) / 1.25 = 52.6 → 53。
Qmax = [13, 9, 13, 9, 9]
# 各仓库库存+在途+订货的容量上限（约束 (2)，钉出状态侧）
# 仓 3 有意放宽当系统蓄水池，仓 2/5 偏紧 ⇒ 产生调拨需求（沿用 Imax/Qmax 原比例）。
# 每仓都满足 Imax ≥ L·Qmax —— 低于 L·Qmax 时管道自己就顶破容量、订购率被压到
# Q̂ < Qmax，Qmax 就不再是唯一起作用的约束了。
Imax = [52, 36, 87, 45, 36]
# 期初月龄**摊开宽度**（整数）：0 = 全在月龄 0（新投产机队）；K = 均摊在月龄 0..K−1。
# 本组必须取 0：机队小，θ·n 本来就贴近 rint 的 0.5 阈值，摊开只会把失效整桶抹掉。
spread_init = 0

[cost]
C = 50.0       # 单位采购成本（备件本身）
h = 1.0        # 单位持有成本（期内取期初期末平均）
Cs = 200.0     # 单台风机月停机成本
atc = 5.0      # 主动调拨单位运输成本（双向）
tc = 10.0      # 被动调拨基准单位成本；实际按优先级顺位 ×(pos−1)×tc

[degradation]
m = 2.5            # 威布尔形状参数（≥ 1）。文献区间 1.2~2.8，齿轮箱以磨损（老化）为主
eta = 148.0        # 威布尔尺度参数（月）= 12.3 年 ≈ 108,000 运行小时
a_beta = 2.0       # θ ~ Beta(a_beta, b)，一阶矩匹配 E[θ] = p
beta_cov = [0.015, 0.025, 0.010]   # 中心化 PHM 三协变量系数（油温/启停/满负荷）
z_bar = [60.0, 5.0, 65.0]          # 协变量中心（同上顺序）

[covariate]
mu_T = 60.0       # 油温均值 (°C)
sigma_T = 4.0     # 油温标准差
lambda = 5.0      # 启停次数 Poisson 均值
alpha_L = 7.8     # 满负荷占比 Beta 第一参数
beta_L = 4.2      # 满负荷占比 Beta 第二参数

[scenario]
pool_size = 300   # (z, θ) 场景池条数；全阶段共享、等概率
seed = 2026       # 池采样种子

# 被动调拨优先级（可选）：{仓库号 = [按优先级排列的仓库号]}。
# 缺省则自动生成（N_R=5 时沿用 MutiInventory 实测表）。
# [priority]
# 1 = [1, 2, 3, 4, 5]
