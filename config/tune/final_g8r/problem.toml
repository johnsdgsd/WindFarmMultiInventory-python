# 问题参数：风场多仓库备件库存管理（等级模型，纯 LP）
#
# 模型与推导见 docs/建模与实现.md：
#   - G=4 个运行健康等级 0..3，等级 4 为失效态；
#   - 每月等级增量 ~ Poisson(lambda0)，3 位小数转移矩阵；
#   - 逐行 Dirichlet 外生化，E[Theta]=P；
#   - 运行台数/转移流量/替换量连续（纯 LP，前向/后向都解 LP）。
#
# 默认值只写在这一份文件里，代码里没有第二处默认值 —— 改这里必定生效。
# 训练时本文件会被原样拷贝进结果目录。
# 维度一旦改动，旧结果目录的割不再兼容（状态维度变了），必须全新训练。

[dimension]
T = 60        # 规划期（月）= 20 年
G = 4          # 运行健康等级数；等级 0..G-1 运行，等级 G=4 为失效态
N_R = 5        # 仓库数
L = 3          # 订货提前期（月）；在途管 L-1=2 层

[fleet]
# 机队保持 16,030 台；Qmax/Imax 已按等级模型重新定标（2026-10-24）：
#   月度失效峰值 16.48 台（第 240 期），平均 5.98 台/月；
#   ΣQmax = 13 ⇒ 峰值/ΣQmax = 1.27，保留末期结构性缺口；
#   各仓峰值/Qmax = [1.26, 1.40, 1.30, 1.14, 1.30]；
#   Imax/Qmax = [4, 4, 6.67, 5, 4]，且 Imax ≥ L·Qmax（L=3）。
N = [3680, 2730, 3780, 3320, 2520]
Qmax = [3,2,3,3,2]
Imax = [12, 8, 20, 15, 8]

# fleet/dem 约束右端的数值容差（台）：只吸收 LP 浮点残差（IIS 实测曾超 3.9e-7），
# 物理上可忽略。
fleet_tol = 1e-6
# 状态流转的数值处理：n 块先 round 到 6 位小数；若 Σn 仍超 N 且超额不超过
# state_repair_tol，则从最大分量中扣除超额（不缩放）；超过则视为真不可行并报错。
state_round_digits = 6
state_repair_tol = 1e-4

# 初始等级分布（长度 G、非负、和为 1）。
# 2026-10-26：改为 T240 同一条 20 年确定性轨迹在第 127 月的等级分布；
# 即 T60 研究同一机队的第 11–15 年窗口（约 99 台/年失效），而不是质保期前 5 年。
# λ0 与「全新机队 20 年累计失效约 8.8%」的定标不变（该定标由 _t_grade_calib 单独校验）。
# [1,0,0,0] = 全部全新机队（旧口径）。
init_mix = [0.420, 0.369, 0.163, 0.048]
# 各仓初始可用库存（台，长度 N_R）；0 = 空库存起步。
I0 = [2,1,2,2,1]

# 金额单位：万元
[cost]
C = 50.0       # 采购：万元/件（2–3 MW 陆上齿轮箱备件取 50）
h = 0.4
Cs = 20.0
atc = 5.0
tc = 10.0

[degradation]
lambda0 = 0.007    # Poisson 基准均值（等级增量/月）
dirichlet_s = 20.0 # 逐行 Dirichlet 集中度（初值；生产可调到约 300）
p_digits = 3       # 转移矩阵保留小数位（按用户要求 3 位）
beta_cov = [0.015, 0.025, 0.010]   # 中心化 PHM 三协变量系数（乘在 lambda 上）
z_bar = [60.0, 5.0, 65.0]          # 协变量中心（油温/启停/满负荷）

[covariate]
mu_T = 60.0       # 油温均值 (°C)
sigma_T = 4.0     # 油温标准差
lambda = 5.0      # 启停次数 Poisson 均值（注意：不是退化 lambda0）
alpha_L = 7.8     # 满负荷占比 Beta 第一参数
beta_L = 4.2      # 满负荷占比 Beta 第二参数

[scenario]
pool_size = 300   # (z, Θ) 场景池条数；全阶段共享、等概率
seed = 2026       # 池采样种子

# 被动调拨优先级（可选）：{仓库号 = [按优先级排列的仓库号]}。
# 缺省则自动生成（N_R=5 时沿用 MutiInventory 实测表）。
# [priority]
# 1 = [1, 2, 3, 4, 5]
